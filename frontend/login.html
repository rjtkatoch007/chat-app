<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Chat App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="auth-page">
  <main class="auth-wrapper">
    <div class="card auth-card shadow">
      <div class="card-body p-4 p-md-5">
        <div class="brand-mark">💬</div>
        <h1 class="text-center mb-2">Welcome back</h1>
        <p class="text-center text-muted mb-4">Login to continue chatting</p>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="identifier" class="form-label">Email or phone number</label>
            <input type="text" class="form-control" id="identifier" placeholder="you@example.com or 9876543210" autocomplete="username" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Your password" autocomplete="current-password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="loginButton">Login</button>
          <div id="message" class="mt-3" role="alert"></div>
        </form>

        <div class="text-center mt-4">
          <span class="text-muted">New to Chat App?</span>
          <a href="./signup.html"> Create an account</a>
        </div>
      </div>
    </div>
  </main>
  <script src="./js/login.js"></script>
</body>
</html>
