<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat | Chat App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="chat-page">
  <main class="chat-shell">
    <aside class="chat-sidebar">
      <header class="sidebar-header">
        <div class="avatar" id="myAvatar">U</div>
        <div class="sidebar-title">
          <strong id="myName">Loading...</strong>
          <small id="myEmail">Loading account...</small>
        </div>
        <button class="icon-btn" id="logoutButton" title="Logout" aria-label="Logout">↪</button>
      </header>

      <form class="search-box" id="emailSearchForm">
        <span>⌕</span>
        <input type="email" id="emailSearch" placeholder="Enter user's email" autocomplete="off" required>
        <button type="submit" class="search-user-btn">Chat</button>
      </form>
      <small class="search-help">Enter a registered user's email to join their private room.</small>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <section class="conversation">
      <header class="conversation-header">
        <div class="avatar" id="contactAvatar">💬</div>
        <div>
          <strong id="contactName">Select a user</strong>
          <small id="contactStatus">Search by email to start a private chat</small>
        </div>
      </header>

      <div class="message-area" id="messageArea" aria-live="polite">
        <div class="empty-chat-state">Search for a user's email to start chatting.</div>
      </div>

      <form class="message-composer" id="messageForm">
        <button type="button" class="composer-btn" aria-label="Emoji">☺</button>
        <input id="messageInput" type="text" placeholder="Type a message" autocomplete="off" aria-label="Message" disabled>
        <button type="submit" class="send-btn" aria-label="Send" disabled>➤</button>
      </form>
    </section>
  </main>
  <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  <script src="./js/chat.js"></script>
</body>
</html>
