<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Chat App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="chat-page">
  <main class="chat-shell">
    <aside class="chat-sidebar">
      <header class="sidebar-header">
        <div class="avatar" id="myAvatar">U</div>
        <div class="sidebar-title">
          <strong id="myName">Chats</strong>
          <small>My account</small>
        </div>
        <button class="icon-btn" id="logoutButton" title="Logout" aria-label="Logout">↪</button>
      </header>

      <div class="search-box">
        <span>⌕</span>
        <input type="search" id="chatSearch" placeholder="Search or start new chat">
      </div>

      <div class="chat-list" id="chatList">
        <button class="chat-item active" data-name="Alex Johnson">
          <div class="avatar">A</div>
          <div class="chat-item-content">
            <div class="chat-item-top"><strong>Alex Johnson</strong><time>10:42 AM</time></div>
            <div class="chat-preview">See you tomorrow! 👋</div>
          </div>
        </button>
        <button class="chat-item" data-name="Priya Sharma">
          <div class="avatar">P</div>
          <div class="chat-item-content">
            <div class="chat-item-top"><strong>Priya Sharma</strong><time>Yesterday</time></div>
            <div class="chat-preview">The files are ready.</div>
          </div>
        </button>
        <button class="chat-item" data-name="Rahul Mehta">
          <div class="avatar">R</div>
          <div class="chat-item-content">
            <div class="chat-item-top"><strong>Rahul Mehta</strong><time>Monday</time></div>
            <div class="chat-preview">Thanks!</div>
          </div>
        </button>
      </div>
    </aside>

    <section class="conversation">
      <header class="conversation-header">
        <div class="avatar" id="contactAvatar">A</div>
        <div>
          <strong id="contactName">Alex Johnson</strong>
          <small>online</small>
        </div>
      </header>

      <div class="message-area" id="messageArea" aria-live="polite">
        <div class="date-divider"><span>Today</span></div>
        <div class="message received"><div class="bubble">Hey! How are you?<time>10:39 AM</time></div></div>
        <div class="message sent"><div class="bubble">I'm good! Working on our new chat app. 😊<time>10:40 AM ✓✓</time></div></div>
        <div class="message received"><div class="bubble">Nice! The interface is looking great.<time>10:41 AM</time></div></div>
        <div class="message sent"><div class="bubble">See you tomorrow! 👋<time>10:42 AM ✓✓</time></div></div>
      </div>

      <form class="message-composer" id="messageForm">
        <button type="button" class="composer-btn" aria-label="Emoji">☺</button>
        <input id="messageInput" type="text" placeholder="Type a message" autocomplete="off" aria-label="Message">
        <button type="submit" class="send-btn" aria-label="Send">➤</button>
      </form>
    </section>
  </main>
  <script src="./js/chat.js"></script>
</body>
</html>
