<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | Chat App</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body class="auth-page">
  <main class="auth-wrapper">
    <div class="card auth-card shadow">
      <div class="card-body p-4 p-md-5">
        <div class="brand-mark">💬</div>
        <h1 class="text-center mb-2">Create account</h1>
        <p class="text-center text-muted mb-4">Join Chat App and start messaging</p>

        <form id="signupForm" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" placeholder="Your name" autocomplete="name" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" placeholder="you@example.com" autocomplete="email"
              required>
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone number</label>
            <input type="tel" class="form-control" id="phone" placeholder="9876543210" autocomplete="tel" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="At least 6 characters" minlength="6"
              autocomplete="new-password" required>
          </div>

          <button type="submit" class="btn btn-primary w-100" id="signupButton">Create account</button>
          <div id="message" class="mt-3" role="alert"></div>
        </form>

        <div class="text-center mt-4">
          <span class="text-muted">Already have an account?</span>
          <a href="./login.html"> Login</a>
        </div>
      </div>
    </div>
  </main>
  <script src="./js/signup.js"></script>
</body>

</html>
